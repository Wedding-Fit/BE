name: 'Feature Request'
description: '새로운 기능이나 작업 요청을 위한 이슈 템플릿'
labels: [feat]
title: '[FEAT] 이슈 이름을 작성해주세요'
body:
  - type: dropdown
    id: branchType
    attributes:
      label: '📂 브랜치 타입 (Branch Type)'
      description: '브랜치 타입을 선택해주세요'
      options:
        - feat
        - fix
        - refactor
        - docs
        - chore
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: '🌳 브랜치명 (Branch)'
      description: '영어로 브랜치명을 작성해주세요 (예: feat/auth-signin)'
    validations:
      required: true

  - type: input
    id: description
    attributes:
      label: '📝 상세 내용 (Description)'
      description: '이슈에 대해서 간략히 설명해주세요'
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: '✅ 체크리스트 (Tasks)'
      description: '해당 이슈에 필요한 작업 목록을 작성해주세요'
      value: |
        - [ ] Controller 생성
        - [ ] Service 로직 구현
        - [ ] DTO 정의
        - [ ] 단위/통합 테스트 작성
        - [ ] Swagger 문서화
    validations:
      required: true