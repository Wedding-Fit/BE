spring:
  application:
    name: be
  
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: root
    password: 1234
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  
  h2:
    console:
      enabled: true
  
  # CORS 설정
  web:
    cors:
      allowed-origins: "*"
      allowed-methods: "*" 
      allowed-headers: "*"
      allow-credentials: true

server:
  port: 8080
  error:
    whitelabel:
      enabled: false